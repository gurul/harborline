name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Scorecard matches the docs
        run: npm run -s scorecard -- --verify-docs
